name: build-final

on:
  push:
    branches:
      - '**'
    paths:
      - 'build-patches/**'
      - 'overlay/**'
      - 'ramdisk-overlay/**'
      - 'ramdisk-recovery-overlay/**'
      - 'scripts/**'
      - 'vendor-ramdisk-overlay/**'
      - 'bootconfig'
      - 'build.sh'
      - 'deviceinfo'
      - 'Dockerfile'
  workflow_dispatch:

env:
  BUILDER_IMAGE_REPOSITORY: git.deusch.me/ubports/husky-final-builder
  BUILD_TOOLS_BRANCH: main
  BUILD_TOOLS_REPO: https://gitlab.com/ubports/porting/community-ports/halium-generic-adaptation-build-tools.git
  PACKAGE_REGISTRY_BASE: https://git.deusch.me/api/packages/ubports/generic/husky
  # NOTE: LineageOS only keeps the last ~3 builds - mirror this zip (as done for
  # tegu on anubis.steffend.me) before the URL rots:
  #   lineage-23.2-20261009-nightly-husky-signed.zip
  #   sha256: 7b3cd1db0b76d043f4270a23c89e382894c955d77e2cc23b6f10986f7d2167a2
  LINEAGE_ZIP_URL: https://mirrorbits.lineageos.org/full/husky/20261009/lineage-23.2-20261009-nightly-husky-signed.zip

jobs:
  build-builder-image:
    runs-on: alpine-docker
    outputs:
      builder_image: ${{ steps.meta.outputs.builder_image }}
    steps:
      - name: Install Docker CLI and Buildx
        run: apk add --no-cache docker-cli docker-cli-buildx git bash

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Forgejo Container Registry
        uses: docker/login-action@v3
        with:
          registry: git.deusch.me
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          set -euo pipefail
          commit_short="$(printf '%s' "${{ github.sha }}" | cut -c1-7)"
          branch_tag="$(printf '%s' "${{ github.ref_name }}" | sed 's#[^A-Za-z0-9_.-]#-#g')"
          echo "commit_short=${commit_short}" >> "${GITHUB_OUTPUT}"
          echo "branch_tag=${branch_tag}" >> "${GITHUB_OUTPUT}"
          echo "builder_image=${BUILDER_IMAGE_REPOSITORY}:${commit_short}" >> "${GITHUB_OUTPUT}"

      - name: Build and push (main branch)
        if: github.ref_name == 'main' || github.ref_name == 'master'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.BUILDER_IMAGE_REPOSITORY }}:latest
            ${{ steps.meta.outputs.builder_image }}
          cache-from: type=registry,ref=${{ env.BUILDER_IMAGE_REPOSITORY }}:latest
          cache-to: type=inline

      - name: Build and push (other branches)
        if: github.ref_name != 'main' && github.ref_name != 'master'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.BUILDER_IMAGE_REPOSITORY }}:${{ steps.meta.outputs.branch_tag }}
            ${{ steps.meta.outputs.builder_image }}
          cache-from: type=registry,ref=${{ env.BUILDER_IMAGE_REPOSITORY }}:latest
          cache-to: type=inline

  final-artifacts:
    runs-on: alpine-docker
    needs: build-builder-image
    env:
      IMAGE_TAG: ${{ needs.build-builder-image.outputs.builder_image }}
      SKIP_DOCKER_BUILD: '1'
    steps:
      - name: Install Docker CLI and Buildx
        run: apk add --no-cache docker-cli docker-cli-buildx git bash

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Forgejo Container Registry
        uses: docker/login-action@v3
        with:
          registry: git.deusch.me
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Compute package branch
        id: pkgbranch
        run: |
          set -euo pipefail
          branch="$(printf '%s' "${{ github.ref_name }}" | sed 's#[^A-Za-z0-9_.-]#-#g')"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      - name: Build final Ubuntu Touch artifacts in Docker
        env:
          PACKAGE_BRANCH: ${{ steps.pkgbranch.outputs.branch }}
        run: ./scripts/run-docker-build.sh

      - name: Build super.img
        run: |
          apk add --no-cache curl unzip android-tools coreutils
          ./scripts/build-super-image.sh \
            "${LINEAGE_ZIP_URL}" \
            "$(pwd)/artifacts" \
            "$(pwd)/artifacts/super.img" \
            "$(pwd)/workdir/super"
          (cd artifacts && sha256sum super.img >> SHA256SUMS)

      # - name: Upload build artifacts
      #   uses: actions/upload-artifact@v3
      #   with:
      #     name: husky-final-${{ github.sha }}
      #     path: artifacts/
      #     if-no-files-found: error

      - name: Package images.zip
        run: |
          apk add --no-cache zip
          mkdir -p package
          (cd artifacts && zip -j "$(pwd)/../package/images.zip" \
            boot.img \
            dtbo.img \
            init_boot.img \
            vendor_boot.img \
            vendor_kernel_boot.img \
            super.img)

      - name: Publish images.zip to Forgejo release
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eo pipefail
          apk add --no-cache curl jq
          branch_tag="$(printf '%s' "${{ github.ref_name }}" | sed 's#[^A-Za-z0-9_.-]#-#g')"
          tag="latest-${branch_tag}"
          repo_api="https://git.deusch.me/api/v1/repos/${{ github.repository }}"
          asset_name="images.zip"
          echo "tag=${tag}"
          echo "repo_api=${repo_api}"

          BODY_FILE="$(mktemp)"
          STATUS=000

          # api METHOD URL [curl args...] -> writes body to $BODY_FILE, sets $STATUS
          api() {
            local method="$1" url="$2"; shift 2
            STATUS="$(curl -sS -o "${BODY_FILE}" -w '%{http_code}' \
              -X "${method}" -H "Authorization: token ${TOKEN}" "$@" "${url}")"
            echo "${method} ${url} -> ${STATUS}" >&2
            cat "${BODY_FILE}" >&2
            echo >&2
          }

          api GET "${repo_api}/releases/tags/${tag}"
          if [ "${STATUS}" = "404" ]; then
            echo "Release not found, creating..." >&2
            payload="$(jq -nc \
              --arg tag "${tag}" \
              --arg sha "${{ github.sha }}" \
              --arg name "Latest build (${branch_tag})" \
              --arg body "Rolling latest build for branch \`${branch_tag}\`." \
              '{tag_name:$tag,target_commitish:$sha,name:$name,body:$body}')"
            api POST "${repo_api}/releases" \
              -H "Content-Type: application/json" -d "${payload}"
          fi
          if [ "${STATUS}" -ge 400 ]; then
            echo "Failed to get/create release (HTTP ${STATUS})" >&2
            exit 1
          fi
          release="$(cat "${BODY_FILE}")"

          rel_id="$(printf '%s' "${release}" | jq -r .id)"
          old_ids="$(printf '%s' "${release}" | jq -r --arg n "${asset_name}" \
            '.assets[]? | select(.name==$n) | .id')"
          echo "release_id=${rel_id}"
          echo "old_asset_ids=${old_ids:-<none>}"

          api POST "${repo_api}/releases/${rel_id}/assets?name=${asset_name}" \
            -F "attachment=@package/${asset_name}"
          if [ "${STATUS}" -ge 400 ]; then
            echo "Asset upload failed (HTTP ${STATUS})" >&2
            exit 1
          fi

          for aid in ${old_ids}; do
            api DELETE "${repo_api}/releases/${rel_id}/assets/${aid}"
            if [ "${STATUS}" -ge 400 ] && [ "${STATUS}" != "404" ]; then
              echo "Failed to delete old asset ${aid} (HTTP ${STATUS})" >&2
              exit 1
            fi
          done
