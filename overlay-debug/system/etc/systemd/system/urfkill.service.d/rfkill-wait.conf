[Unit]
# husky defect #10: urfkilld must not start before the rfkill control
# device and switches exist, else it enumerates zero killswitches for
# the whole boot and the flight-mode/wifi toggles no-op.
After=dev-rfkill.device

[Service]
ExecStartPre=/bin/sh -c "for i in $(seq 1 100); do [ -c /dev/rfkill ] && [ -d /sys/class/rfkill/rfkill0 ] && exit 0; sleep 0.2; done; echo urfkill-rfkill-wait: timed out >&2; exit 0"
