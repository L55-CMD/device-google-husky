name: build-final

on:
  push:
    branches:
      - '**'
    paths:
      - 'build-patches/**'
      - 'overlay/**'
      - 'overlay-debug/**'
      - 'ramdisk-overlay/**'
      - 'ramdisk-recovery-overlay/**'
      - 'scripts/**'
      - 'vendor-ramdisk-overlay/**'
      - 'dependencies.lock'
      - 'bootconfig'
      - 'build.sh'
      - 'deviceinfo'
      - 'Dockerfile'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  PACKAGE_REGISTRY_BASE: https://github.com/${{ github.repository_owner }}/husky-packages/releases/download
  KERNEL_REGISTRY_BASE: https://github.com/${{ github.repository_owner }}/lineage-kernel-manifest-husky/releases/download
  LINEAGE_ZIP_URL: https://github.com/${{ github.repository_owner }}/husky-packages/releases/download/main/lineage-23.2-20261009-nightly-husky-signed.zip

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax and ShellCheck
        run: |
          set -euo pipefail
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash -n build.sh
          shellcheck scripts/*.sh build.sh

      - name: YAML validation
        run: |
          set -euo pipefail
          python3 - .github/workflows/*.yml <<'PY'
          import sys
          try:
              import yaml
          except ImportError as exc:
              raise SystemExit("PyYAML is required for workflow validation") from exc
          for path in sys.argv[1:]:
              with open(path, "r", encoding="utf-8") as handle:
                  yaml.safe_load(handle)
          PY

      - name: Overlay validation
        run: ./scripts/validate-overlay.sh

  final-artifacts:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        variant: [normal, debug]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: build-final-${{ github.ref }}-${{ matrix.variant }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
                      /usr/lib/jvm /opt/hostedtoolcache 2>/dev/null || true
          df -h /

      - name: Compute package branch and resolve coordinated kernel
        id: pkg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="$(printf '%s' "${{ github.ref_name }}" | sed 's#[^A-Za-z0-9_.-]#-#g')"
          # Kernel releases are named after the manifest branch (rolling per-branch).
          tag="${branch}"
          kernel_release="$(gh api "repos/${{ github.repository_owner }}/lineage-kernel-manifest-husky/releases/tags/${tag}" \
            --jq '.assets[] | select(.name == "kernel.zip") | .digest')"
          case "${kernel_release}" in
            sha256:*) kernel_release="${kernel_release#sha256:}" ;;
            *) echo "kernel.zip digest missing for ${tag}" >&2; exit 1 ;;
          esac
          manifest_rev="$(gh api "repos/${{ github.repository_owner }}/lineage-kernel-manifest-husky/git/ref/heads/${{ github.ref_name }}" \
            --jq '.object.sha')"
          patches_rev="$(gh api "repos/${{ github.repository_owner }}/kernel-patches-husky/git/ref/heads/${{ github.ref_name }}" \
            --jq '.object.sha')"
          {
            echo "branch=${branch}"
            echo "kernel_tag=${tag}"
            echo "kernel_sha256=${kernel_release}"
            echo "manifest_rev=${manifest_rev}"
            echo "patches_rev=${patches_rev}"
          } >> "${GITHUB_OUTPUT}"

      - name: Normalize overlay links
        run: |
          set -euo pipefail
          for tree in overlay overlay-debug; do
            [ -d "${tree}" ] || continue
            find "${tree}" -type d -name '*.wants' | while read -r d; do
              find "$d" -maxdepth 1 -type f | while read -r f; do
                target="$(cat "$f")"
                if [[ -z "${target}" || "${target}" == *$'\n'* ]]; then
                  echo "Invalid systemd wants target in $f" >&2
                  exit 1
                fi
                rm "$f"
                ln -s "$target" "$f"
              done
            done
          done
          for f in \
            overlay/system/usr/lib/aarch64-linux-gnu/libgbinder.so.1 \
            overlay/system/usr/lib/aarch64-linux-gnu/libgbinder.so.1.1 \
            overlay/system/usr/lib/aarch64-linux-gnu/libgbinder-radio.so.1 \
            overlay/system/usr/lib/aarch64-linux-gnu/libgbinder-radio.so.1.6; do
            target="$(cat "$f")"
            rm "$f"
            ln -s "$target" "$f"
          done

      - name: Build ${{ matrix.variant }} Ubuntu Touch artifacts in Docker
        env:
          IMAGE_TAG: husky-final-builder:ci
          HUSKY_BUILD_VARIANT: ${{ matrix.variant }}
          PACKAGE_BRANCH: ${{ steps.pkg.outputs.branch }}
          KERNEL_RELEASE_TAG: ${{ steps.pkg.outputs.kernel_tag }}
          KERNEL_ZIP_SHA256: ${{ steps.pkg.outputs.kernel_sha256 }}
        run: ./scripts/run-docker-build.sh

      - name: Build ${{ matrix.variant }} super.img
        run: |
          set -euo pipefail
          source dependencies.lock
          docker run --rm \
            -e LINEAGE_ZIP_SHA256="${LINEAGE_ZIP_SHA256}" \
            -v "$(pwd):$(pwd)" -w "$(pwd)" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            alpine:3.20 \
            sh -c "apk add --no-cache android-tools curl unzip coreutils bash docker-cli e2fsprogs >/dev/null && \
                   ./scripts/build-super-image.sh \
                     '${LINEAGE_ZIP_URL}' \
                     '$(pwd)/artifacts' \
                     '$(pwd)/artifacts/super.img' \
                     '$(pwd)/workdir/super'"

      - name: Package ${{ matrix.variant }} images
        run: |
          set -euo pipefail
          source dependencies.lock
          mkdir -p package
          (cd artifacts && zip -j "$(pwd)/../package/boot-images.zip" \
            boot.img \
            dtbo.img \
            init_boot.img \
            vendor_boot.img \
            vendor_kernel_boot.img)
          (cd artifacts && split -b 1800m super.img "$(pwd)/../package/super.img.part-")
          cp -f artifacts/android-rootfs.img package/android-rootfs.img
          cat > package/MANIFEST.txt <<EOF
          husky build manifest
          ====================
          build_variant: ${{ matrix.variant }}
          device_repository: ${{ github.repository }}
          device_branch: ${{ github.ref_name }}
          device_revision: ${{ github.sha }}
          kernel_release_tag: ${{ steps.pkg.outputs.kernel_tag }}
          kernel_manifest_repository: ${{ github.repository_owner }}/lineage-kernel-manifest-husky
          kernel_manifest_branch: ${{ github.ref_name }}
          kernel_manifest_revision: ${{ steps.pkg.outputs.manifest_rev }}
          kernel_patches_repository: ${{ github.repository_owner }}/kernel-patches-husky
          kernel_patches_branch: ${{ github.ref_name }}
          kernel_patches_revision: ${{ steps.pkg.outputs.patches_rev }}
          build_tools_repository: ${BUILD_TOOLS_REPO}
          build_tools_revision: ${BUILD_TOOLS_REVISION}
          halium_system_file: ${HALIUM_SYSTEM_FILE}
          halium_system_sha256: ${HALIUM_SYSTEM_SHA256}
          libhybris_file: ${LIBHYBRIS_FILE}
          libhybris_sha256: ${LIBHYBRIS_SHA256}
          lineage_zip_file: ${LINEAGE_ZIP_FILE}
          lineage_zip_url: ${LINEAGE_ZIP_URL}
          lineage_zip_sha256: ${LINEAGE_ZIP_SHA256}
          initrd_url: ${INITRD_URL}
          initrd_sha256: ${INITRD_SHA256}
          recovery_image_url: ${RECOVERY_IMAGE_URL}
          recovery_image_sha256: ${RECOVERY_IMAGE_SHA256}
          EOF
          (cd package && sha256sum boot-images.zip super.img.part-* android-rootfs.img MANIFEST.txt > SHA256SUMS)

      - name: Publish ${{ matrix.variant }} rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch_tag="$(printf '%s' "${{ github.ref_name }}" | sed 's#[^A-Za-z0-9_.-]#-#g')"
          tag="latest-${branch_tag}-${{ matrix.variant }}"
          gh release delete "${tag}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${tag}" package/* \
            --title "Latest ${{ matrix.variant }} build (${branch_tag})" \
            --notes "Rolling ${{ matrix.variant }} build for branch \`${branch_tag}\` (device commit ${{ github.sha }})." \
            --latest=false
