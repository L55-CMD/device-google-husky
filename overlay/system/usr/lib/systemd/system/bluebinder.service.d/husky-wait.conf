[Service]
# Default bluebinder_wait.sh greps `init.svc.*bluetooth*`, but husky's BT HAL
# service is named `bcmbtlinux` and bluebinder 1.0.19 talks to it via AIDL.
# Reset and replace with a husky-aware poll.
ExecStartPre=
ExecStartPre=/bin/sh -c 'while [ "$(getprop init.svc.bcmbtlinux 2>/dev/null)" != "running" ]; do sleep 0.5; done'
