[Service]
# Gate sensorfwd on the AIDL sensors HAL being ready. Without this, every
# adaptor fails to instantiate ("HYBRIS CTL invalid sensor type", state
# changed to invalid) until the next service restart.
ExecStartPre=/bin/sh -c 'while [ "$(getprop init.svc.vendor.sensors-hal-multihal 2>/dev/null)" != "running" ]; do sleep 0.5; done'
