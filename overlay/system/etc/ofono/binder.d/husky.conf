# ofono binder driver configuration for Pixel 8 Pro (husky)
# Uses AIDL IRadio HAL v2.2 (Samsung SIT RIL on Tensor G3)

[Settings]
Device=/dev/binder
InterfaceType = aidl
ExpectSlots = slot1,slot2
3GLTEHandover = false
MaxNonDataMode = none

emptyPinQuery = false
useDataProfiles = true
signalStrengthRange=-113,-51

[slot1]
path = /slot1
slot = 0

[slot2]
path = /slot2
slot = 1
